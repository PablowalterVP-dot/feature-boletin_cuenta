# nginx del contenedor del frontend. Sirve la compilación de Vite y reenvía /api
# a la API por la red interna de docker compose: mismo origen, sin CORS, y la
# API y el bot no se exponen fuera del servidor.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Las áreas suben su Excel por aquí; el de Nutrición pesa unos cientos de KB.
    client_max_body_size 20m;

    # Hospitalización (servidor/hospitalizacion/): /api/hospitalizacion/x va a /api/x de
    # ese servicio. El nombre se resuelve en cada pedido (resolver de Docker) y no al
    # arrancar: si ese contenedor se reinicia o se cae, nginx sigue arrancando y solo
    # esas pantallas reciben un 502 («Sin conexión con hospitalización»).
    location /api/hospitalizacion/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $hospitalizacion http://hospitalizacion:8010;
        rewrite ^/api/hospitalizacion/(.*)$ /api/$1 break;
        proxy_pass $hospitalizacion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La carga espera al bot (hasta BOT_VALIDADOR_SEGUNDOS, 10 s por omisión).
        proxy_read_timeout 60s;
    }

    # Vite pone un hash en el nombre de cada archivo de assets/: se pueden
    # guardar para siempre. index.html no, para que una versión nueva se vea.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Los formatos oficiales de DIRESA. Un archivo que falta es un 404, no el
    # index.html del caso de abajo: llenar una página web como si fuera un Excel
    # daba un error que no decía qué faltaba.
    location /plantillas/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
