<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" data-base="176" data-cabeza-y="66" data-sudor-x="152" data-sudor-y="94" style="--m-piel-1:#e6f7f2;--m-piel-2:#a8dfcb;--m-solapa:#b5d3c8;--m-tubo:#1f6f63;--m-tinta:#163a33;--m-globo-tinta:var(--m-tinta);--m-sombra:var(--m-tinta);--m-brillo:#ffffff;--m-globo:#ffffff;--m-globo-borde:#c3ddd3;--m-ok:#00a76f;--m-alerta:#e5533d;--m-corazon:#ff6b81;--m-cruz:#00a76f;--m-sudor:#6ec6f0;--m-destello:#ffc23c;--m-zz:#6f8f86">
  <!-- Dr. Mochi, la versión elegida (A de la ronda 2). Los colores que cambian
       con la paleta son variables en la raíz: m-piel-1 y m-piel-2 (el
       degradado del cuerpo), m-solapa, m-tubo (estetoscopio) y
       m-tinta (ojos y boca), con el prefijo de doble guion de CSS. Los
       valores de aquí son la paleta por defecto. -->
  <defs>
    <linearGradient id="piel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-piel-1)"/>
      <stop offset="1" style="stop-color:var(--m-piel-2)"/>
    </linearGradient>
    <radialGradient id="metal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d5dfe2"/>
      <stop offset="1" stop-color="#93a3a9"/>
    </radialGradient>
    <clipPath id="silueta"><rect x="42" y="66" width="116" height="110" rx="55"/></clipPath>
  </defs>
  <ellipse class="m-sombra" cx="100" cy="179" rx="48" ry="6" style="fill:var(--m-sombra)" opacity="0.14"/>
  <g class="m-cuerpo">
    <rect x="42" y="66" width="116" height="110" rx="55" fill="url(#piel)"/>
    <g clip-path="url(#silueta)">
      <path d="M30 136 H80 L100 168 L120 136 H170 V190 H30 Z" fill="#ffffff"/>
      <path d="M80 136 L90 151 L85 154 L100 168 M120 136 L110 151 L115 154 L100 168" fill="none" style="stroke:var(--m-solapa)" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <g class="m-capa" data-paralaje="0.35">
      <path d="M84 143 C82 158 90 166 100 166 C110 166 118 158 116 143" fill="none" style="stroke:var(--m-tubo)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="84" cy="142" r="3.4" style="fill:var(--m-tubo)"/>
      <circle cx="116" cy="142" r="3.4" style="fill:var(--m-tubo)"/>
      <circle cx="100" cy="167" r="6.5" fill="url(#metal)" style="stroke:var(--m-tubo)" stroke-width="3"/>
    </g>
    <g class="m-cara" data-paralaje="1">
      <g class="m-ojos" data-cx="100" data-cy="108" data-estilo="pildora" data-brillo="no" data-sep="36" data-w="14" data-h="20"></g>
      <g class="m-boca" data-cx="100" data-cy="128" data-w="15"></g>
    </g>
    <g class="m-capa" data-paralaje="0.8">
      <path d="M48 96 Q100 66 152 96" fill="none" stroke="#4f6f69" stroke-width="5" stroke-linecap="round"/>
      <circle cx="74" cy="83" r="12" fill="url(#metal)" stroke="#6c7c82" stroke-width="2"/>
      <circle cx="74" cy="83" r="3" fill="#4d5c61"/>
      <path d="M66.5 79 A8 8 0 0 1 73 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <g class="m-globo" data-x="154" data-y="56"></g>
</svg>
