<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratorio de cabecera</title>
  <!-- Los tokens del kit, tal como los carga la aplicación. -->
  <link rel="stylesheet" href="/node_modules/@hrl/core-ui/tokens.css" />
  <style>
    /* Página de pruebas, fuera de la aplicación. Ningún color escrito a mano:
       los degradados mezclan tokens del kit (verde de marca, verde profundo y
       los verdes agua de la mascota). */
    body { margin: 0; }
    .lab { min-height: 100vh; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-sans); font-size: var(--text-base); }

    /* El texto claro sobre el degradado no puede ser --primary-foreground: en
       modo oscuro ese token se vuelve oscuro, y el degradado sigue siendo
       oscuro. Aquí se toma el blanco de la mascota (no cambia con el tema). Si
       se elige una variante, el kit necesita un token propio para «texto sobre
       marca» (por ejemplo --on-brand). */
    .lab { --cab-texto: var(--mascota-blanco); }

    .lab__barra {
      position: sticky; top: 0; z-index: 5;
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4);
      padding: var(--space-3) var(--space-5);
      background: var(--surface); border-bottom: 1px solid var(--border-soft);
    }
    .lab__barra h1 { margin: 0; font-size: var(--text-lg); font-weight: var(--weight-bold); }
    .lab__barra p { margin: 0; flex: 1; min-width: 240px; font-size: var(--text-sm); color: var(--muted-foreground); }
    .lab__grupo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); }
    .lab__etiqueta { margin-right: var(--space-1); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--muted-foreground); }
    .lab__toggle {
      min-height: var(--touch-target); padding: 0 var(--space-3);
      border: 1px solid var(--input-border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text-primary);
      font: inherit; font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: pointer;
    }
    .lab__toggle[aria-pressed='true'] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
    .lab__toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

    .lab__cuerpo { display: grid; gap: var(--space-6); max-width: 1180px; margin: 0 auto; padding: var(--space-6) var(--space-5); }
    .lab--movil .lab__cuerpo { max-width: 420px; }

    .variante { display: grid; gap: var(--space-3); }
    .variante__cabeza h2 { margin: 0; font-size: var(--text-xl); font-weight: var(--weight-bold); letter-spacing: -0.02em; }
    .variante__nota { margin: 0; max-width: 80ch; color: var(--text-secondary); line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: 0; padding: 0; list-style: none; }
    .chips li { padding: 2px var(--space-2); border-radius: var(--radius-xs); background: var(--muted); font-size: var(--text-xs); color: var(--text-secondary); }

    /* El lienzo imita el área de contenido: la cabecera arriba y algo de
       módulo debajo, para juzgarla en su sitio y no suelta. */
    .lienzo { display: grid; gap: var(--space-4); padding: var(--space-5); background: var(--bg-app); border: 1px dashed var(--input-border); border-radius: var(--radius-sm); }
    .relleno { display: grid; gap: var(--space-2); padding: var(--space-5); background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
    .relleno span { height: 10px; border-radius: var(--radius-full); background: var(--muted); }
    .relleno span:nth-child(1) { width: 40%; height: 14px; }
    .relleno span:nth-child(2) { width: 85%; }
    .relleno span:nth-child(3) { width: 65%; }

    /* ------------------------------------------------------ piezas comunes */

    .cab { position: relative; isolation: isolate; overflow: hidden; border-radius: var(--radius-card); color: var(--cab-texto); }
    .cab__migas { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); margin: 0 0 var(--space-1); font-size: var(--text-sm); font-weight: var(--weight-medium); opacity: 0.86; }
    .cab__migas [aria-current] { font-weight: var(--weight-bold); opacity: 1; }
    .cab h3 { margin: 0; font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: -0.03em; line-height: 1.15; }
    .cab__sub { margin: var(--space-1) 0 0; font-size: var(--text-base); opacity: 0.88; }
    .cab__pastilla {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
      background: color-mix(in srgb, var(--cab-texto) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--cab-texto) 26%, transparent);
      font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap;
    }
    .cab__fila { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); }

    /* Sobre el degradado, el botón verde del kit se pierde: va en blanco con
       texto verde profundo. En la mitad clara de «Partida» queda el de siempre. */
    .cab--ondas .hrl-btn, .cab--compacta .hrl-btn {
      background: var(--cab-texto); border-color: var(--cab-texto); color: var(--brand-deep);
    }

    /* 1 · Banda degradada */
    .cab--banda {
      padding: var(--space-6);
      background:
        radial-gradient(circle at 88% 15%, color-mix(in srgb, var(--mascota-cuerpo) 55%, transparent), transparent 45%),
        linear-gradient(120deg, var(--brand-deep) 0%, var(--mascota-estetoscopio) 55%, var(--brand) 100%);
    }

    /* 2 · Con Dr. Mochi */
    .cab--mochi {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--space-4);
      padding: var(--space-5) var(--space-6) 0;
      background:
        radial-gradient(circle at 92% 110%, color-mix(in srgb, var(--mascota-cuerpo) 60%, transparent), transparent 45%),
        linear-gradient(135deg, var(--mascota-tinta) 0%, var(--brand-deep) 50%, var(--mascota-estetoscopio) 100%);
    }
    .cab--mochi .cab__texto { padding-bottom: var(--space-5); }
    .cab__saludo { margin: 0 0 var(--space-2); font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--mascota-cuerpo-claro); }
    .cab__mochi { display: flex; align-items: flex-end; gap: var(--space-2); }
    .cab__globo {
      align-self: center; max-width: 220px; margin-bottom: var(--space-6);
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-md) var(--radius-md) var(--radius-xs) var(--radius-md);
      background: color-mix(in srgb, var(--cab-texto) 14%, transparent); border: 1px solid color-mix(in srgb, var(--cab-texto) 24%, transparent);
      font-size: var(--text-sm); line-height: 1.4;
    }
    .lab--movil .cab--mochi { grid-template-columns: 1fr; }
    .lab--movil .cab__globo { display: none; }

    /* 3 · Ondas */
    .cab--ondas {
      padding: var(--space-6) var(--space-6) calc(var(--space-6) + 28px);
      background: linear-gradient(110deg, var(--brand-deep) 0%, var(--brand) 100%);
    }
    .cab__ondas { position: absolute; inset: auto 0 0 0; z-index: -1; width: 100%; height: 70px; }
    .cab__ondas path:nth-child(1) { fill: color-mix(in srgb, var(--mascota-cuerpo) 35%, transparent); }
    .cab__ondas path:nth-child(2) { fill: color-mix(in srgb, var(--mascota-cuerpo-claro) 22%, transparent); }
    .cab__ondas path:nth-child(3) { fill: color-mix(in srgb, var(--mascota-estetoscopio) 70%, transparent); }

    /* 4 · Vidrio */
    .cab--vidrio {
      padding: var(--space-5);
      background:
        radial-gradient(circle at 12% 20%, color-mix(in srgb, var(--mascota-cuerpo) 75%, transparent), transparent 40%),
        radial-gradient(circle at 80% 90%, color-mix(in srgb, var(--brand) 85%, transparent), transparent 45%),
        linear-gradient(135deg, var(--mascota-tinta), var(--brand-deep));
    }
    .cab__vidrio {
      padding: var(--space-5) var(--space-6);
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--cab-texto) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--cab-texto) 22%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }

    /* 5 · Compacta con icono y estado */
    .cab--compacta {
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      background: linear-gradient(100deg, var(--brand-deep) 0%, var(--mascota-estetoscopio) 70%, color-mix(in srgb, var(--mascota-cuerpo) 70%, var(--mascota-estetoscopio)) 100%);
    }
    .cab--compacta h3 { font-size: var(--text-xl); }
    .cab__baldosa {
      display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--cab-texto) 16%, transparent); border: 1px solid color-mix(in srgb, var(--cab-texto) 24%, transparent);
    }
    .cab--compacta .cab__texto { flex: 1; min-width: 200px; }
    .cab__lado { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }

    /* 6 · Partida */
    .cab--partida { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); box-shadow: var(--shadow-card); }
    .cab--partida .cab__oscura {
      padding: var(--space-6);
      background:
        radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--mascota-cuerpo) 45%, transparent), transparent 50%),
        linear-gradient(135deg, var(--brand-deep), var(--mascota-estetoscopio));
    }
    .cab--partida .cab__clara {
      display: grid; align-content: center; gap: var(--space-3); padding: var(--space-5) var(--space-6);
      background: var(--surface); color: var(--text-primary);
    }
    .cab__dato { display: grid; gap: 2px; }
    .cab__dato small { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; }
    .cab__dato strong { font-size: var(--text-md); }
    .lab--movil .cab--partida { grid-template-columns: 1fr; }
    @media (max-width: 700px) { .cab--partida { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="lab hrl-nuevo" id="lab">
    <header class="lab__barra">
      <h1>Laboratorio de cabecera</h1>
      <p>La cabecera de cada módulo («Nutrición y Dietética › Inicio» y su título) como tarjeta con degradado verde y verde agua. Seis variantes y la actual para comparar.</p>
      <div class="lab__grupo" role="group" aria-label="Ejemplo" id="ejemplos">
        <span class="lab__etiqueta">Ejemplo</span>
        <button type="button" class="lab__toggle" data-ejemplo="inicio" aria-pressed="true">Inicio del área</button>
        <button type="button" class="lab__toggle" data-ejemplo="reporte" aria-pressed="false">Reporte del mes</button>
        <button type="button" class="lab__toggle" data-ejemplo="bandeja" aria-pressed="false">Bandeja de Estadística</button>
      </div>
      <div class="lab__grupo">
        <button type="button" class="lab__toggle" id="tema" aria-pressed="false">Modo oscuro</button>
        <button type="button" class="lab__toggle" id="movil" aria-pressed="false">Ancho de teléfono</button>
      </div>
    </header>
    <main class="lab__cuerpo" id="variantes"></main>
  </div>

  <script type="module">
    import { createElement as h } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Button, Icon, IconSprite, Mascot, PageHeader } from '@hrl/core-ui';

    /* Lo que dice la cabecera en tres pantallas reales. Los nombres y fechas
       son los del prototipo (ficticios). */
    const EJEMPLOS = {
      inicio: {
        migas: ['Nutrición y Dietética', 'Inicio'],
        titulo: 'Departamento de Nutrición y Dietética',
        sub: 'sábado, 3 de octubre de 2026',
        icono: 'sh-cutlery',
        estado: 'Agosto 2026 · En llenado',
        saludo: 'Buenos días, Ana',
        mascota: 'idle',
        globo: 'Falta subir el Excel de agosto. ¿Lo revisamos juntos?',
        accion: ['Subir el Excel', 'sh-upload'],
        datos: [['Periodo', 'Agosto 2026'], ['Estado', 'En llenado'], ['Envía a', 'Estadística y Planeamiento']],
      },
      reporte: {
        migas: ['Nutrición y Dietética', 'Reporte del mes'],
        titulo: 'Reporte del mes',
        sub: 'Suba el Excel del mes; el bot lo revisa y usted lo envía a Estadística',
        icono: 'sh-calendar',
        estado: '3 errores por corregir',
        saludo: 'Paso 2 de 3',
        mascota: 'problem',
        globo: 'Encontré 3 casillas que no cuadran. Están marcadas en rojo.',
        accion: ['Ver lo que falta', 'sh-eye'],
        datos: [['Periodo', 'Agosto 2026'], ['Archivo', 'Nutricion_2026-08.xlsx'], ['Por resolver', '3 errores']],
      },
      bandeja: {
        migas: ['Estadística', 'Bandeja de revisión'],
        titulo: 'Bandeja de revisión',
        sub: 'Reportes recibidos de las diez áreas en el periodo',
        icono: 'sh-inbox',
        estado: '7 de 10 áreas entregaron',
        saludo: 'Agosto 2026',
        mascota: 'thinking',
        globo: 'Hay 4 reportes esperando revisión.',
        accion: ['Revisar el siguiente', 'sh-eye'],
        datos: [['Recibidos', '7 de 10'], ['Por revisar', '4'], ['Vence', '10 de septiembre']],
      },
    };

    const migas = (e) =>
      `<nav class="cab__migas" aria-label="Ruta de navegación">${e.migas
        .map((m, i) => (i === e.migas.length - 1 ? `<span aria-current="page">${m}</span>` : `<span>${m}</span><span aria-hidden="true">›</span>`))
        .join('')}</nav>`;

    /* Cada variante: título, por qué existe, rasgos y su marcado. Los huecos
       data-* se llenan con componentes del kit (icono, botón, mascota). */
    const VARIANTES = [
      {
        nombre: '0 · Actual',
        nota: 'Como está hoy (PageHeader del kit), para comparar: migas, título y fecha sobre el fondo de la página, sin tarjeta.',
        rasgos: ['Sin fondo', 'Texto oscuro'],
        html: () => '<div data-actual></div>',
      },
      {
        nombre: '1 · Banda degradada',
        nota: 'La más directa: una banda del verde profundo al verde de la marca, con un brillo verde agua en la esquina. El estado del mes va en una pastilla a la derecha.',
        rasgos: ['Degradado 120°', 'Brillo verde agua', 'Pastilla de estado'],
        html: (e) => `<section class="cab cab--banda"><div class="cab__fila"><div>${migas(e)}<h3>${e.titulo}</h3><p class="cab__sub">${e.sub}</p></div><span class="cab__pastilla"><span data-icono="sh-calendar"></span>${e.estado}</span></div></section>`,
      },
      {
        nombre: '2 · Con Dr. Mochi',
        nota: 'Un saludo y la mascota del hospital asomando por la derecha, con lo que hay que hacer en su globo. Cambia de expresión según la pantalla: espera, encontró algo, revisa. En el teléfono el globo se esconde.',
        rasgos: ['Saludo', 'Mascot del kit', 'Globo con lo pendiente'],
        html: (e) => `<section class="cab cab--mochi"><div class="cab__texto">${migas(e)}<p class="cab__saludo">${e.saludo}</p><h3>${e.titulo}</h3><p class="cab__sub">${e.sub}</p></div><div class="cab__mochi"><p class="cab__globo">${e.globo}</p><span data-mascota="${e.mascota}"></span></div></section>`,
      },
      {
        nombre: '3 · Ondas',
        nota: 'El degradado con tres ondas verde agua en la base, que se superponen. Más ilustrativa; las ondas son solo forma, todo el texto queda sobre el tramo oscuro.',
        rasgos: ['Ondas superpuestas', 'Botón de acción'],
        html: (e) => `<section class="cab cab--ondas"><div class="cab__fila"><div>${migas(e)}<h3>${e.titulo}</h3><p class="cab__sub">${e.sub}</p></div><span data-boton="${e.accion[0]}" data-boton-icono="${e.accion[1]}"></span></div><svg class="cab__ondas" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C200 10 400 70 600 40 S1000 10 1200 35 V70 H0Z"/><path d="M0 52 C250 30 450 75 700 50 S1050 30 1200 50 V70 H0Z"/><path d="M0 62 C300 50 600 75 900 60 S1100 52 1200 60 V70 H0Z"/></svg></section>`,
      },
      {
        nombre: '4 · Vidrio',
        nota: 'Manchas de verde agua sobre un fondo casi negro y, encima, una placa de vidrio esmerilado con el texto. La más moderna; el desenfoque cuesta algo de rendimiento en equipos lentos.',
        rasgos: ['Manchas de color', 'Vidrio esmerilado', 'Pastilla de estado'],
        html: (e) => `<section class="cab cab--vidrio"><div class="cab__vidrio cab__fila"><div>${migas(e)}<h3>${e.titulo}</h3><p class="cab__sub">${e.sub}</p></div><span class="cab__pastilla"><span data-icono="sh-clock"></span>${e.estado}</span></div></section>`,
      },
      {
        nombre: '5 · Compacta con icono',
        nota: 'Baja y densa: el icono del módulo en una baldosa, el título y, a la derecha, el estado y la acción principal. Ocupa la mitad de alto que las demás y sirve igual en todas las pantallas.',
        rasgos: ['Icono del módulo', 'Mitad de alto', 'Estado y acción'],
        html: (e) => `<section class="cab cab--compacta"><span class="cab__baldosa"><span data-icono="${e.icono}" data-tamano="26"></span></span><div class="cab__texto">${migas(e)}<h3>${e.titulo}</h3></div><div class="cab__lado"><span class="cab__pastilla">${e.estado}</span><span data-boton="${e.accion[0]}" data-boton-icono="${e.accion[1]}"></span></div></section>`,
      },
      {
        nombre: '6 · Partida',
        nota: 'Dos mitades: a la izquierda el degradado con el título; a la derecha, en claro, tres datos del momento y la acción. Es cabecera y resumen a la vez. En pantallas angostas se apilan.',
        rasgos: ['Oscura + clara', 'Tres datos', 'Acción'],
        html: (e) => `<section class="cab cab--partida"><div class="cab__oscura">${migas(e)}<h3>${e.titulo}</h3><p class="cab__sub">${e.sub}</p></div><div class="cab__clara">${e.datos.map(([k, v]) => `<div class="cab__dato"><small>${k}</small><strong>${v}</strong></div>`).join('')}<span data-boton="${e.accion[0]}" data-boton-icono="${e.accion[1]}"></span></div></section>`,
      },
    ];

    const destino = document.getElementById('variantes');
    let raices = [];

    function pintar(clave) {
      raices.forEach((r) => r.unmount());
      raices = [];
      const e = EJEMPLOS[clave];
      destino.innerHTML = VARIANTES.map((v, i) => `
        <section class="variante" aria-labelledby="v${i}">
          <div class="variante__cabeza"><h2 id="v${i}">${v.nombre}</h2></div>
          <p class="variante__nota">${v.nota}</p>
          <ul class="chips" aria-label="Rasgos">${v.rasgos.map((r) => `<li>${r}</li>`).join('')}</ul>
          <div class="lienzo">${v.html(e)}<div class="relleno" aria-hidden="true"><span></span><span></span><span></span></div></div>
        </section>`).join('');

      const montar = (nodo, elemento) => {
        const r = createRoot(nodo);
        r.render(elemento);
        raices.push(r);
      };
      destino.querySelectorAll('[data-actual]').forEach((n) =>
        montar(n, h(PageHeader, { title: e.titulo, description: e.sub, breadcrumbs: e.migas.map((label) => ({ label })) })));
      destino.querySelectorAll('[data-icono]').forEach((n) => montar(n, h(Icon, { name: n.dataset.icono, size: Number(n.dataset.tamano ?? 15) })));
      destino.querySelectorAll('[data-boton]').forEach((n) => montar(n, h(Button, { icon: n.dataset.botonIcono }, n.dataset.boton)));
      destino.querySelectorAll('[data-mascota]').forEach((n) => montar(n, h(Mascot, { state: n.dataset.mascota, size: 'lg' })));
    }

    /* El sprite de iconos, una vez. */
    const sprite = document.createElement('div');
    document.body.append(sprite);
    createRoot(sprite).render(h(IconSprite));

    const botones = [...document.querySelectorAll('#ejemplos [data-ejemplo]')];
    const elegir = (clave) => {
      botones.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ejemplo === clave)));
      pintar(clave);
    };
    botones.forEach((b) => b.addEventListener('click', () => elegir(b.dataset.ejemplo)));

    const raiz = document.documentElement;
    const tema = document.getElementById('tema');
    const fijarTema = (oscuro) => {
      raiz.dataset.temaHrl = oscuro ? 'oscuro' : 'claro';
      tema.setAttribute('aria-pressed', String(oscuro));
    };
    tema.addEventListener('click', () => fijarTema(raiz.dataset.temaHrl !== 'oscuro'));
    const movil = document.getElementById('movil');
    movil.addEventListener('click', () => {
      const activo = document.getElementById('lab').classList.toggle('lab--movil');
      movil.setAttribute('aria-pressed', String(activo));
    });

    /* Enlace directo: ?ejemplo=reporte&tema=oscuro&movil=1 */
    const params = new URLSearchParams(location.search);
    if (params.get('tema') === 'oscuro') fijarTema(true);
    if (params.get('movil') === '1') movil.click();
    elegir(EJEMPLOS[params.get('ejemplo')] ? params.get('ejemplo') : 'inicio');
  </script>
</body>
</html>
